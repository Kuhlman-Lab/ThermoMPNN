[project]
name = "thermompnn"
version = "0.0.1"
description = "Graph neural network for predicting protein stability changes (ddG) from point mutants."
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [
  { name = "Henry Dieckhaus", email = "dieckhau@unc.edu" },
]
dependencies = [
  "torchmetrics==1.9.0",
  "pytorch-lightning==2.6.5",
  "biopython==1.88",
  "wandb==0.30.0",
  "tqdm==4.70.0",
  "pandas==2.3.3",
  "numpy==2.2.6",
  "omegaconf==2.3.1",
  "joblib==1.6.0",
]

[project.optional-dependencies]
cpu = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "torchaudio==2.5.1",
]
cu121 = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "torchaudio==2.5.1",
]
cu124 = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "torchaudio==2.5.1",
]

[tool.uv]
package = false
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu121" },
    { extra = "cu124" },
  ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu121", extra = "cu121" },
  { index = "pytorch-cu124", extra = "cu124" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu121", extra = "cu121" },
  { index = "pytorch-cu124", extra = "cu124" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu121", extra = "cu121" },
  { index = "pytorch-cu124", extra = "cu124" },
]
